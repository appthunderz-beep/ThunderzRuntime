name: Build Thunderz Tools (Windows x64)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup MSYS2 (MINGW64)
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: |
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-gcc

      - name: Compile Runtime and Editor
        shell: 'bash -l {0}'
        run: |
          set -e
          export PATH="/c/msys64/mingw64/bin:$PATH"
          mkdir -p build
          echo "g++ version:"
          g++ --version

          g++ -static -O2 -std=gnu++17 ThunderzRuntime.cpp -o build/ThunderzRuntime.exe -lgdiplus -lgdi32 -luser32 -lkernel32 -municode -mwindows
          g++ -static -O2 -std=gnu++17 ThunderzEditor.cpp  -o build/ThunderzEditor.exe  -lgdiplus -lgdi32 -luser32 -lkernel32 -municode -mwindows

          ls -lh build/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: thunderz-tools-x64
          path: build/




