name: Build Thunderz Runtime (Windows x64)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4

    - name: Install MSYS2
      uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW64
        update: true
        install: |
          mingw-w64-x86_64-toolchain
          mingw-w64-x86_64-gcc

    - name: Compile ThunderzRuntime.cpp
      shell: bash -l {0}
      run: |
        set -e
        export PATH="/c/msys64/mingw64/bin:$PATH"
        mkdir -p build
        echo "Using GCC:"
        g++ --version
        # BUILD (final working command with unicode support)
        g++ -static -O2 ThunderzRuntime.cpp -o build/ThunderzRuntime.exe -lgdiplus -lgdi32 -luser32 -lkernel32 -municode
        ls -lh build/

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: thunderz-windows-x64
        path: build/ThunderzRuntime.exe



